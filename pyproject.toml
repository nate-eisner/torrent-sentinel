[tool.poetry]
name = "torrent-sentinel"
version = "0.1.0"
description = "Automated VPN Rotation & Torrent Health Monitor"
authors = ["Nate <nate@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
rich = "^13.7.0"
typer = ">=0.12.0"
aiosqlite = "^0.20.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
torrent-sentinel = "torrent_sentinel.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
